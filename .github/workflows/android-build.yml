name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile Production Web Bundle
        run: npm run build
        env:
          CI: false # Disable strict lint/warning build failures if any exist

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Synchronize Web Assets with Capacitor
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Compile Android Packages (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Upload Compiled APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediBudget-Android-APKs
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
